<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hotel Details - HotelHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
    <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">HotelHub</a>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <div class="row mb-4">
                <div class="col-lg-8">
                    <h1 id="hotelName" class="display-5 fw-bold text-primary">Loading...</h1>
                    <p id="hotelLocation" class="text-muted"><i class="fas fa-map-marker-alt"></i> ...</p>
                    <p id="hotelDescription" class="lead">...</p>
                </div>
                <div class="col-lg-4 text-lg-end">
                    <a href="hotels.html" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Back to Results</a>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-5">
                <div class="card-body bg-light">
                    <form id="checkAvailabilityForm" class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label fw-bold">Check-in / Check-out</label>
                            <input type="text" id="dateRange" class="form-control" placeholder="Select dates">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">Adults</label>
                            <select id="adults" class="form-select">
                                <option value="1">1 Adult</option>
                                <option value="2" selected>2 Adults</option>
                                <option value="3">3 Adults</option>
                                <option value="4">4 Adults</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-bold">Children</label>
                            <select id="children" class="form-select">
                                <option value="0">0 Children</option>
                                <option value="1">1 Child</option>
                                <option value="2">2 Children</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100">Check Availability</button>
                        </div>
                    </form>
                </div>
            </div>

            <h3 class="mb-4">Available Rooms</h3>
            <div id="roomsGrid" class="row">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    
    <script type="module" src="assets/js/hotel-details.js"></script>
</body>
</html>
