<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hotel Details - HotelHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">HotelHub</a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div id="hotelContainer">
        <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center"><p class="mb-0">&copy; 2024 HotelHub</p></div>
  </footer>

  <script type="module">
    // small inline module to keep the page self-contained, it delegates to hotel-details API
    const API_HOTEL_DETAILS = '/hotelmanagement/api/hotel/hotel_details.php';

    function qs(name) {
      return new URLSearchParams(location.search).get(name);
    }

    async function loadDetails() {
      const id = qs('hotel_id');
      const openBooking = qs('open_booking') === 'true' || qs('open_booking') === '1';
      const container = document.getElementById('hotelContainer');
      if (!id) { container.innerHTML = '<p class="text-danger">Hotel id missing.</p>'; return; }

      container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Loading hotel details...</p></div>';

      try {
        const res = await fetch(`${API_HOTEL_DETAILS}?hotel_id=${encodeURIComponent(id)}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.message || 'Failed to load');

        const hotel = json.data.hotel;
        const rooms = json.data.rooms || [];

        // Build UI
        const html = `
          <div class="row">
            <div class="col-lg-8">
              <h2>${escapeHtml(hotel.name)}</h2>
              <p class="text-muted">${escapeHtml(hotel.location || '')}</p>
              <p>${escapeHtml(hotel.description || '')}</p>
              <p><strong>Amenities:</strong> ${Array.isArray(hotel.amenities) ? hotel.amenities.join(', ') : ''}</p>
            </div>
            <div class="col-lg-4 text-end">
              <a href="hotels.html" class="btn btn-outline-secondary mb-3">Back to results</a>
            </div>
          </div>

          <hr />

          <h4 class="mb-3">Available Rooms</h4>
          <div id="roomsList" class="row g-3">
            ${rooms.map(r => `
              <div class="col-md-6">
                <div class="card shadow-sm">
                  <div class="card-body">
                    <h5 class="card-title">${escapeHtml(r.type)} ${r.room_number ? ' — ' + escapeHtml(r.room_number) : ''}</h5>
                    <p class="mb-1"><strong>Price:</strong> $${r.price_per_night}</p>
                    <p class="mb-1"><strong>Capacity:</strong> ${r.capacity}</p>
                    <p class="mb-2"><strong>Status:</strong> ${escapeHtml(r.status)}</p>
                    <div>
                      <a class="btn btn-sm btn-primary me-2 book-btn" href="create_booking.html?hotel_id=${encodeURIComponent(hotel.id)}&room_id=${encodeURIComponent(r.id)}">Book</a>
                      <button class="btn btn-sm btn-outline-secondary details-room" data-room='${escapeHtml(JSON.stringify(r))}'>More</button>
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;

        container.innerHTML = html;

        // If openBooking requested, click first book button
        if (openBooking) {
          const first = document.querySelector('.book-btn');
          if (first) first.click();
        }

        // attach details button handlers (optional)
        document.querySelectorAll('.details-room').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const r = JSON.parse(btn.getAttribute('data-room'));
            alert(`${r.type} — $${r.price_per_night}/night\nCapacity: ${r.capacity}\nStatus: ${r.status}`);
          });
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="alert alert-danger">Failed to load hotel details: ${escapeHtml(err.message)}</div>`;
      }
    }

    function escapeHtml(str) {
      if (!str && str !== 0) return '';
      return String(str).replace(/[&<>"']/g, (s) => {
        const map = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
        return map[s];
      });
    }

    loadDetails();
  </script>
</body>
</html>
