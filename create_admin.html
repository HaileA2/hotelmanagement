<!DOCTYPE html>
<html>
<head>
    <title>Create Admin User</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { padding: 10px 15px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #dff0d8; color: #3c763d; }
        .error { background: #f2dede; color: #a94442; }
    </style>
</head>
<body>
    <h2>Create Admin User</h2>
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" value="admin@example.com">
    </div>
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" value="admin123">
    </div>
    <div class="form-group">
        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" value="Admin">
    </div>
    <div class="form-group">
        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" value="User">
    </div>
    <button onclick="createAdmin()">Create Admin User</button>
    <div id="result"></div>

    <script>
    async function createAdmin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const firstName = document.getElementById('first_name').value;
        const lastName = document.getElementById('last_name').value;
        
        const resultDiv = document.getElementById('result');
        resultDiv.className = '';
        resultDiv.textContent = 'Creating admin user...';

        try {
            const response = await fetch('api/auth/register.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email,
                    password,
                    first_name: firstName,
                    last_name: lastName,
                    role: 'admin'
                })
            });

            const data = await response.json();
            
            if (response.ok) {
                resultDiv.className = 'success';
                resultDiv.innerHTML = `
                    <h3>Admin User Created Successfully!</h3>
                    <p>Email: ${email}</p>
                    <p>Password: ${password}</p>
                    <p>You can now <a href="public/index.html">login here</a>.</p>
                `;
            } else {
                throw new Error(data.message || 'Failed to create admin user');
            }
        } catch (error) {
            resultDiv.className = 'error';
            resultDiv.textContent = `Error: ${error.message}`;
        }
    }
    </script>
</body>
</html>
